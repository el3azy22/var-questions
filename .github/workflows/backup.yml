name: نسخة احتياطية يومية للأسئلة
on:
  schedule:
    - cron: "41 22 * * *"   # كل يوم 2:41 الفجر بتوقيت الإمارات
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/backup_bank.py
      - run: |
          if [ -n "$(git status --porcelain questions.json)" ]; then
            git config user.name "var-bot"; git config user.email "var-bot@users.noreply.github.com"
            git add questions.json && git commit -m "نسخة احتياطية للأسئلة من لوحة التحكم" && git push
          fi
