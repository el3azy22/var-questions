name: تحديث جدول الدوري ونتايجه
on:
  schedule:
    - cron: "17 */2 * * *"   # كل ساعتين
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_fixtures.py
      - run: |
          if ! git diff --quiet fixtures.json 2>/dev/null || [ -n "$(git status --porcelain fixtures.json)" ]; then
            git config user.name "var-bot"; git config user.email "var-bot@users.noreply.github.com"
            git add fixtures.json && git commit -m "تحديث جدول الدوري ونتايجه" && git push
          fi
